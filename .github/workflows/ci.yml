name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true
          cache-dependency-path: pnpm-lock.yaml
      - run: vp check
      - run: vp test
      - name: Compile and validate the userstyle
        run: vp run check:less

  # Not a required check: the result depends on Backlog's deployed CSS, so a
  # Backlog release must not block unrelated pull requests.
  coverage:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true
          cache-dependency-path: pnpm-lock.yaml
      - name: Check legacy and new design token coverage
        run: vp run check:coverage
      - run: vp run check:dark-text
        if: ${{ !cancelled() }}
